apis:
- name: Beacons Creator MCP Server
  description: >-
    A live, first-party Model Context Protocol server exposing a Beacons creator's
    own data to an agent. Discovered through the RFC 9728 Protected Resource
    Metadata document Beacons serves at
    https://beacons.ai/.well-known/oauth-protected-resource, which names this exact
    resource. Protected by an OAuth 2.1 authorization code + PKCE (S256) flow with
    open dynamic client registration and a single advertised scope, mcp:read, so
    the published surface is read-only. tools/list returns 401 with a
    WWW-Authenticate bearer challenge, meaning the tool manifest and every
    inputSchema require an authenticated creator; Beacons publishes no
    documentation, no llms.txt tool list and no help-centre article for this
    server, so no tool names are recorded.
  humanURL: https://beacons.ai
  baseURL: https://beacons.ai/api/v001/creator/mcp
