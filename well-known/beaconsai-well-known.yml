source: live GET of /.well-known/* on every Beacons.ai host known to this profile
note: >-
  Beacons.ai serves no security.txt, no OpenID Connect discovery document, no
  api-catalog and no ai-plugin.json. It DOES serve RFC 8414 OAuth 2.0
  Authorization Server Metadata and RFC 9728 OAuth 2.0 Protected Resource
  Metadata, and those two documents are the only public, machine-readable
  declaration of a Beacons developer surface that exists anywhere — they name a
  hosted MCP server at https://beacons.ai/api/v001/creator/mcp. Beacons publishes
  no developer portal, no API reference and no help-centre article describing
  this endpoint; it was found by probing, not by documentation.
